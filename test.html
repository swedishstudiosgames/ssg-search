<!doctype html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bex is an open-source secure, and privacy focused search engine.">
    <title>Bex</title>
    <link rel="icon" type="image/svg" href="https://bexy.se/root/lib/assets/gfx/img/ico/favico/emblem/logo.svg">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap">
    <link rel="stylesheet" href="https://bexy.se/root/lib/src/css/style-v2.css">
    
    <!-- Added Styles for Shortcuts -->
    <style>
        .shortcuts-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .shortcut-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            width: 80px;
            cursor: pointer;
            transition: transform 0.2s ease;
            font-family: 'Poppins', sans-serif;
        }

        .shortcut-item:hover {
            transform: translateY(-3px);
        }

        .shortcut-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        /* Dark mode fallback for icons if your site uses a dark theme */
        @media (prefers-color-scheme: dark) {
            .shortcut-icon { background-color: #2a2a2a; }
            .shortcut-label { color: #e0e0e0; }
        }

        .shortcut-icon img {
            width: 24px;
            height: 24px;
        }

        .shortcut-label {
            font-size: 12px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            color: inherit;
        }

        .add-btn {
            background-color: #ddd;
            color: #555;
            font-size: 24px;
            border: none;
            cursor: pointer;
            line-height: 1;
        }
        
        @media (prefers-color-scheme: dark) {
            .add-btn { background-color: #333; color: #aaa; }
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; opacity: 0; pointer-events: none;
            transition: opacity 0.2s ease;
        }
        .modal-overlay.active {
            opacity: 1; pointer-events: auto;
        }
        .modal-box {
            background: #fff; padding: 24px; border-radius: 12px; width: 90%; max-width: 320px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            font-family: 'Poppins', sans-serif; transform: translateY(-20px);
            transition: transform 0.2s ease;
        }
        .modal-overlay.active .modal-box {
            transform: translateY(0);
        }
        .modal-box h3 { margin-top: 0; margin-bottom: 16px; font-size: 18px; color: #333; }
        .modal-box input {
            width: 100%; padding: 10px; margin-bottom: 12px;
            border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box;
            font-family: inherit;
        }
        .modal-box input:focus { outline: 2px solid #2563eb; border-color: transparent; }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
        .modal-btn {
            padding: 8px 16px; border: none; border-radius: 6px;
            cursor: pointer; font-family: inherit; font-weight: bold;
            transition: background-color 0.2s ease;
        }
        .btn-cancel { background: #f0f0f0; color: #555; }
        .btn-cancel:hover { background: #e4e4e4; }
        .btn-add { background: #2563eb; color: #fff; }
        .btn-add:hover { background: #1d4ed8; }

        @media (prefers-color-scheme: dark) {
            .modal-box { background: #2a2a2a; color: #eee; }
            .modal-box h3 { color: #eee; }
            .modal-box input { background: #333; border-color: #444; color: #fff; }
            .btn-cancel { background: #444; color: #eee; }
            .btn-cancel:hover { background: #555; }
            .btn-add { background: #3b82f6; }
            .btn-add:hover { background: #2563eb; }
        }

        /* Autocomplete Styles */
        .autocomplete-items {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            z-index: 99;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-top: 4px;
            overflow: hidden;
            text-align: left;
            font-family: 'Poppins', sans-serif;
        }
        @media (prefers-color-scheme: dark) {
            .autocomplete-items { background: #2a2a2a; border-color: #444; color: #eee; }
        }
        .autocomplete-item {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }
        @media (prefers-color-scheme: dark) {
            .autocomplete-item { border-bottom: 1px solid #444; }
        }
        .autocomplete-item:last-child { border-bottom: none; }
        .autocomplete-item:hover { background-color: #f5f5f5; }
        @media (prefers-color-scheme: dark) {
            .autocomplete-item:hover { background-color: #333; }
        }

        /* Utility for hiding elements reliably */
        .hidden { display: none !important; }

        /* Disabled Menu Buttons */
        #mdd button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: transparent !important;
        }
    </style>
</head>
<body>
    
    <div class="c">
        <form id="sq" class="qf" action="https://search.bexy.se/search" method="POST" role="search" aria-label="Site search">
            <h1>Bex</h1>
            
            <div class="qw">
                <input id="q" class="qi" type="search" name="q" 
                       placeholder="Search the internet..." 
                       autocomplete="off" spellcheck="off" 
                       aria-label="Search query" required>
                
                <input id="qim" class="qi hidden" type="file" name="encoded_image" accept="image/png, image/jpeg, image/gif, image/webp">

                <button type="button" id="clr" class="ib x hidden" aria-label="Clear search">
                    <img class="i" src="https://bexy.se/root/lib/assets/gfx/img/ico/btn/clr.svg" alt="Clear">
                </button>

                <button type="submit" class="ib q" aria-label="Submit search" title="Search">
                    <img class="i" src="https://bexy.se/root/lib/assets/gfx/img/ico/btn/sok.svg" alt="Search">
                </button>

                <button type="button" id="mb" class="ib m" aria-label="Search options" aria-haspopup="true" aria-expanded="false">
                    <img class="i" src="https://bexy.se/root/lib/assets/gfx/img/ico/btn/mom.svg" alt="Options">
                </button>

                <div id="mdd">
                    <button type="button" data-mode="web" class="active">
                        <img class="i" src="https://bexy.se/root/lib/assets/gfx/img/ico/btn/www.svg" alt="Web">
                        Internet Search [Alpha]
                    </button>
                    <button type="button" data-mode="image" disabled>
                        <img class="i" src="https://bexy.se/root/lib/assets/gfx/img/ico/btn/img.svg" alt="Image">
                        Image Search [Coming soon]
                    </button>
                    <button type="button" data-mode="store" disabled>
                        <img class="i" src="https://bexy.se/root/lib/assets/gfx/img/ico/btn/btk.svg" alt="Store">
                        Store Search [Coming soon]
                    </button>
                    <button type="button" data-mode="speech" disabled>
                        <img class="i" src="https://bexy.se/root/lib/assets/gfx/img/ico/btn/mic.svg" alt="Speech">
                        Speech to Text [Coming soon]
                    </button>
                </div>
            </div>

            <script src="https://bexy.se/root/lib/src/js/temp.js" defer crossorigin="anonymous"></script>
        </form>

        <!-- Shortcuts Section -->
        <div id="shortcuts-container" class="shortcuts-container">
            <!-- Shortcuts will be injected here by JavaScript -->
        </div>

        <!-- Add Shortcut Custom Modal -->
        <div id="shortcut-modal" class="modal-overlay">
            <div class="modal-box">
                <h3>Add New Shortcut</h3>
                <input type="text" id="new-site-name" placeholder="Site Name (e.g., Netflix)" autocomplete="off">
                <input type="url" id="new-site-url" placeholder="URL (e.g., https://netflix.com)" autocomplete="off">
                <div class="modal-buttons">
                    <button class="modal-btn btn-cancel" id="cancel-shortcut">Cancel</button>
                    <button class="modal-btn btn-add" id="save-shortcut">Add Site</button>
                </div>
            </div>
        </div>

        <!-- System Message Custom Modal (Replaces alert) -->
        <div id="msg-modal" class="modal-overlay">
            <div class="modal-box" style="text-align: center;">
                <h3 id="msg-title" style="margin-bottom: 8px;">Notification</h3>
                <p id="msg-text" style="font-size: 14px; margin-bottom: 20px; color: inherit;"></p>
                <div class="modal-buttons" style="justify-content: center;">
                    <button class="modal-btn btn-add" id="msg-ok">OK</button>
                </div>
            </div>
        </div>

        <!-- System Confirm Custom Modal (Replaces confirm) -->
        <div id="confirm-modal" class="modal-overlay">
            <div class="modal-box" style="text-align: center;">
                <h3 id="confirm-title" style="margin-bottom: 8px;">Confirm</h3>
                <p id="confirm-text" style="font-size: 14px; margin-bottom: 20px; color: inherit;"></p>
                <div class="modal-buttons" style="justify-content: center;">
                    <button class="modal-btn btn-cancel" id="confirm-cancel">Cancel</button>
                    <button class="modal-btn btn-add" id="confirm-yes">Yes</button>
                </div>
            </div>
        </div>

    </div>
    
    <footer>
        <i>Powered by <a href="https://github.com/searxng/searxng">Searxng</a></i>
    </footer>

    <!-- Consolidated and Fixed JavaScript -->
    <script>
        // --- Global Callbacks & Utilities ---
        
        // 1. Global DDG Autocomplete Callback (Prevents memory leaks from rapid typing)
        window.ddgAutocompleteCallback = function(data) {
            const acContainer = document.querySelector('.autocomplete-items');
            const searchInput = document.getElementById('q');
            const searchForm = document.getElementById('sq');
            
            acContainer.innerHTML = '';
            if (data && data.length > 0) {
                data.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'autocomplete-item';
                    div.innerText = item.phrase;
                    div.addEventListener('click', function(e) {
                        e.preventDefault();
                        searchInput.value = item.phrase;
                        acContainer.style.display = 'none';
                        searchForm.requestSubmit(); // Modern trigger to run validation and submit
                    });
                    acContainer.appendChild(div);
                });
                acContainer.style.display = 'block';
            } else {
                acContainer.style.display = 'none';
            }
        };

        // 2. Custom Dialog System (Replaces browser alert & confirm)
        function showMessage(msg) {
            document.getElementById('msg-text').innerText = msg;
            document.getElementById('msg-modal').classList.add('active');
        }
        document.getElementById('msg-ok').onclick = () => document.getElementById('msg-modal').classList.remove('active');

        function showConfirm(msg, callback) {
            document.getElementById('confirm-text').innerText = msg;
            document.getElementById('confirm-modal').classList.add('active');
            
            // Clone and replace the YES button to remove any stale event listeners
            const yesBtn = document.getElementById('confirm-yes');
            const newYesBtn = yesBtn.cloneNode(true);
            yesBtn.parentNode.replaceChild(newYesBtn, yesBtn);
            
            newYesBtn.onclick = () => {
                document.getElementById('confirm-modal').classList.remove('active');
                if(callback) callback();
            };
            document.getElementById('confirm-cancel').onclick = () => {
                document.getElementById('confirm-modal').classList.remove('active');
            };
        }

        // --- Main Application Logic ---
        document.addEventListener('DOMContentLoaded', () => {
            
            // =========================================
            // UI References
            // =========================================
            const ui = {
                form: document.getElementById('sq'),
                textInput: document.getElementById('q'),
                fileInput: document.getElementById('qim'),
                clearBtn: document.getElementById('clr'),
                menuBtn: document.getElementById('mb'),
                menuDropdown: document.getElementById('mdd'),
                modeBtns: document.querySelectorAll('#mdd button'),
                qwContainer: document.querySelector('.qw'),
                shortcutContainer: document.getElementById('shortcuts-container'),
                shortcutModal: document.getElementById('shortcut-modal'),
                nameInput: document.getElementById('new-site-name'),
                urlInput: document.getElementById('new-site-url'),
                cancelShortcutBtn: document.getElementById('cancel-shortcut'),
                saveShortcutBtn: document.getElementById('save-shortcut')
            };

            const WORKER_URL = '/upload'; 
            let currentMode = 'web';
            let debounceTimeout;
            const scriptTagId = 'ddg-jsonp-script';

            // =========================================
            // Shortcuts Logic
            // =========================================
            const defaultSites = [
                { name: 'YouTube', url: 'https://youtube.com' },
                { name: 'Reddit', url: 'https://reddit.com' },
                { name: 'Wikipedia', url: 'https://wikipedia.org' },
                { name: 'GitHub', url: 'https://github.com' }
            ];

            function setCookie(name, value, days) {
                const date = new Date();
                date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
                document.cookie = name + "=" + encodeURIComponent(value) + ";expires=" + date.toUTCString() + ";path=/";
            }

            function getCookie(name) {
                const nameEQ = name + "=";
                const ca = document.cookie.split(';');
                for(let i = 0; i < ca.length; i++) {
                    let c = ca[i];
                    while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                    if (c.indexOf(nameEQ) === 0) return decodeURIComponent(c.substring(nameEQ.length, c.length));
                }
                return null;
            }

            function loadShortcuts() {
                let cookieData = getCookie('bex_shortcuts');
                let sites = defaultSites;
                
                if (cookieData) {
                    try {
                        sites = JSON.parse(cookieData);
                        if (!Array.isArray(sites)) sites = defaultSites;
                    } catch (e) {
                        console.error("Cookie parse error, falling back to defaults.", e);
                        sites = defaultSites;
                    }
                }
                
                setCookie('bex_shortcuts', JSON.stringify(sites), 30);
                renderShortcuts(sites);
            }

            function renderShortcuts(sites) {
                ui.shortcutContainer.innerHTML = ''; 

                sites.forEach((site, index) => {
                    const link = document.createElement('a');
                    link.className = 'shortcut-item';
                    link.href = site.url;
                    
                    link.oncontextmenu = (e) => {
                        e.preventDefault();
                        showConfirm(`Remove ${site.name} from shortcuts?`, () => removeShortcut(index));
                    };

                    const iconDiv = document.createElement('div');
                    iconDiv.className = 'shortcut-icon';
                    
                    const img = document.createElement('img');
                    let domain = site.url;
                    try { domain = new URL(site.url).hostname; } catch(e) {}
                    
                    img.src = `https://icons.duckduckgo.com/ip3/${domain}.ico`;
                    img.alt = site.name;
                    img.onerror = () => { img.style.display = 'none'; }; 

                    const label = document.createElement('span');
                    label.className = 'shortcut-label';
                    label.innerText = site.name;

                    iconDiv.appendChild(img);
                    link.appendChild(iconDiv);
                    link.appendChild(label);
                    ui.shortcutContainer.appendChild(link);
                });

                const addBtnContainer = document.createElement('div');
                addBtnContainer.className = 'shortcut-item';
                addBtnContainer.onclick = () => {
                    ui.nameInput.value = '';
                    ui.urlInput.value = '';
                    ui.shortcutModal.classList.add('active');
                    ui.nameInput.focus();
                };

                const addBtnIcon = document.createElement('div');
                addBtnIcon.className = 'shortcut-icon add-btn';
                addBtnIcon.innerText = '+';

                const addBtnLabel = document.createElement('span');
                addBtnLabel.className = 'shortcut-label';
                addBtnLabel.innerText = 'Add Site';

                addBtnContainer.appendChild(addBtnIcon);
                addBtnContainer.appendChild(addBtnLabel);
                ui.shortcutContainer.appendChild(addBtnContainer);
            }

            function closeShortcutModal() {
                ui.shortcutModal.classList.remove('active');
            }

            ui.cancelShortcutBtn.addEventListener('click', closeShortcutModal);

            ui.saveShortcutBtn.addEventListener('click', () => {
                let url = ui.urlInput.value.trim();
                const name = ui.nameInput.value.trim();
                
                if (!url || !name) return showMessage('Please provide both a name and a URL.');
                if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;

                let cookieData = getCookie('bex_shortcuts');
                let sites = [];
                
                if (cookieData) {
                    try {
                        sites = JSON.parse(cookieData);
                    } catch (e) {
                        sites = [];
                    }
                }
                
                sites.push({ name, url });
                
                setCookie('bex_shortcuts', JSON.stringify(sites), 30);
                closeShortcutModal();
                loadShortcuts();
            });

            ui.shortcutModal.addEventListener('click', (e) => {
                if (e.target === ui.shortcutModal) closeShortcutModal();
            });

            function removeShortcut(index) {
                let cookieData = getCookie('bex_shortcuts');
                let sites = [];
                
                if (cookieData) {
                    try {
                        sites = JSON.parse(cookieData);
                    } catch (e) {
                        sites = [];
                    }
                }
                
                sites.splice(index, 1);
                setCookie('bex_shortcuts', JSON.stringify(sites), 30);
                loadShortcuts();
            }

            loadShortcuts(); // Initialize Shortcuts

            // =========================================
            // DuckDuckGo Autocomplete Logic
            // =========================================
            ui.qwContainer.style.position = 'relative';

            const acContainer = document.createElement('div');
            acContainer.className = 'autocomplete-items';
            acContainer.style.display = 'none';
            ui.qwContainer.appendChild(acContainer);

            ui.textInput.addEventListener('input', function() {
                clearTimeout(debounceTimeout);
                const val = this.value;
                
                toggleClearBtn();

                if (!val) {
                    acContainer.style.display = 'none';
                    return;
                }
                
                debounceTimeout = setTimeout(() => {
                    const oldScript = document.getElementById(scriptTagId);
                    if (oldScript) oldScript.remove();
                    
                    const script = document.createElement('script');
                    script.id = scriptTagId;
                    script.src = `https://duckduckgo.com/ac/?q=${encodeURIComponent(val)}&callback=ddgAutocompleteCallback`;
                    document.body.appendChild(script);
                }, 150); 
            });

            document.addEventListener('click', function(e) {
                if (e.target !== ui.textInput && !acContainer.contains(e.target)) {
                    acContainer.style.display = 'none';
                }
            });

            // =========================================
            // Search UI Logic (Clear, Modes, Submit)
            // =========================================
            function toggleClearBtn() {
                if (ui.textInput.value.length > 0) {
                    ui.clearBtn.classList.remove('hidden');
                } else {
                    ui.clearBtn.classList.add('hidden');
                }
            }
            
            ui.clearBtn.addEventListener('click', () => {
                ui.textInput.value = '';
                toggleClearBtn();
                ui.textInput.focus();
                acContainer.style.display = 'none';
            });

            if(ui.menuBtn) {
                ui.menuBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const isVisible = ui.menuDropdown.style.display === 'block';
                    ui.menuDropdown.style.display = isVisible ? 'none' : 'block';
                    ui.menuBtn.setAttribute('aria-expanded', !isVisible);
                });

                document.addEventListener('click', (e) => {
                    if (!ui.menuBtn.contains(e.target) && !ui.menuDropdown.contains(e.target)) {
                        ui.menuDropdown.style.display = 'none';
                    }
                });

                ui.modeBtns.forEach(btn => {
                    if (btn.hasAttribute('disabled')) return; // Prevent clicking disabled options
                    
                    btn.addEventListener('click', () => {
                        ui.modeBtns.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        setSearchMode(btn.dataset.mode);
                        ui.menuDropdown.style.display = 'none';
                    });
                });
            }

            function setSearchMode(mode) {
                currentMode = mode;
                ui.textInput.value = '';
                ui.fileInput.value = '';
                toggleClearBtn();

                ui.textInput.classList.remove('hidden');
                ui.fileInput.classList.add('hidden');
                ui.clearBtn.classList.add('hidden');

                switch (mode) {
                    case 'image':
                        ui.textInput.classList.add('hidden');
                        ui.fileInput.classList.remove('hidden');
                        ui.textInput.removeAttribute('required');
                        break;
                    case 'store':
                        ui.textInput.placeholder = "Search the store...";
                        ui.textInput.setAttribute('required', '');
                        break;
                    case 'speech':
                        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                            startDictation();
                        } else {
                            showMessage("Speech not supported.");
                        }
                        ui.textInput.classList.remove('hidden'); 
                        break;
                    default: 
                        ui.textInput.placeholder = "Search the internet...";
                        ui.textInput.setAttribute('required', '');
                        break;
                }
            }

            // =========================================
            // Form Submission (Fixed POST/GET Logic)
            // =========================================
            if (ui.form) {
                ui.form.addEventListener('submit', (e) => {
                    e.preventDefault(); // Intercept to route properly

                    if (currentMode === 'image') {
                        const file = ui.fileInput.files[0];
                        if (!file) return;

                        const validTypes = ['image/jpeg', 'image/png', 'image/gif', 'image/webp', 'image/bmp'];
                        if (!validTypes.includes(file.type)) {
                            showMessage("Please upload a valid image file.");
                            ui.fileInput.value = ''; 
                            return;
                        }
                        handleSecureProxySearch(file);
                    } else {
                        const query = ui.textInput.value.trim();
                        if (!query) return;

                        const targetUrl = currentMode === 'store' 
                            ? 'https://store.swedishstudiosgames.com/search' 
                            : 'https://search.bexy.se/search';
                        
                        // Fix: Preserve privacy by retaining the form's native POST method
                        ui.form.action = targetUrl;
                        ui.form.submit(); // Natively bypasses this event listener to POST the data
                    }
                });
            }

            // =========================================
            // Secure Proxy Upload Logic
            // =========================================
            function handleSecureProxySearch(file) {
                const newTab = window.open('', '_blank');
                
                if (newTab) {
                    newTab.document.write(`
                        <html>
                            <head><title>Secure Search...</title></head>
                            <body style="font-family:sans-serif; text-align:center; padding-top:50px;">
                                <h2>Uploading encrypted image...</h2>
                                <p>Your image will automatically expire in 5 minutes.</p>
                                <div id="status" style="color:#666;">Contacting Secure Proxy...</div>
                            </body>
                        </html>
                    `);
                    newTab.document.close();
                } else {
                    showMessage("Please allow popups for this site to use Image Search.");
                    return;
                }

                const formData = new FormData();
                formData.append('image', file);

                fetch(WORKER_URL, {
                    method: 'POST',
                    body: formData
                })
                .then(res => res.json())
                .then(json => {
                    if (!json.success) throw new Error(json.error?.message || "Upload failed");
                    
                    if (newTab) {
                        newTab.document.getElementById('status').innerText = "Opening image...";
                        newTab.location.href = json.data.url;
                    }
                    ui.fileInput.value = ''; 
                })
                .catch(err => {
                    console.error('Error:', err);
                    if (newTab) {
                        newTab.document.body.innerHTML = `
                            <h2 style="color:red">Error</h2>
                            <p>Failed to connect to secure proxy.</p>
                            <p>${err.message}</p>
                            <p>Please close this tab and try again.</p>
                        `;
                    } else {
                        showMessage("Failed to upload image.");
                    }
                });
            }

            // =========================================
            // Speech Recognition
            // =========================================
            function startDictation() {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                
                recognition.lang = 'en-US';
                recognition.interimResults = false;
                recognition.maxAlternatives = 1;

                ui.textInput.placeholder = "Listening...";
                recognition.start();

                recognition.onresult = (event) => {
                    ui.textInput.value = event.results[0][0].transcript;
                    toggleClearBtn(); 
                };
                recognition.onspeechend = () => recognition.stop();
                recognition.onerror = () => { 
                    ui.textInput.placeholder = "Search the internet...";
                    showMessage("Error hearing voice.");
                }
            }
        });
    </script>
</body>
</html>
