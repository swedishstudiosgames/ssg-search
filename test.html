<!doctype html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary Meta Tags -->
    <title>Bex</title>
    <meta name="title" content="Bex">
    <meta name="description" content="Bex is an open-source secure-, and privacy focused search engine.">
    <meta name="keywords" content="search engine, private search, secure search, open-source, search, privacy, engine, secure, security, secured, searxng, adfree, noai, no-ai, bex, bexy, bexey, beaxy, besy, besie, bexie, beaxie, besi, bexi, beaxi, beasi, beasie, bech, bechi, bechie, bechy">
    <meta name="robots" content="index, follow">
    
    <!-- Resource Hints for Performance -->
    <link rel="preconnect" href="https://suggestqueries.google.com" crossorigin>
    <link rel="preconnect" href="https://icons.duckduckgo.com" crossorigin>

    <!-- Canonical URL to prevent duplicate content issues -->
    <link rel="canonical" href="https://bexy.se/">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://bexy.se/">
    <meta property="og:title" content="Bex">
    <meta property="og:description" content="Bex is an open-source secure, and privacy focused search engine.">
    <meta property="og:image" content="https://bexy.se/root/lib/assets/gfx/img/ico/favico/emblem/logo.svg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary">
    <meta property="twitter:url" content="https://bexy.se/">
    <meta property="twitter:title" content="Bex">
    <meta property="twitter:description" content="Bex is an open-source secure, and privacy focused search engine.">
    <meta property="twitter:image" content="https://bexy.se/root/lib/assets/gfx/img/ico/favico/emblem/logo.svg">

    <!-- Structured Data for Google Rich Results -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Bex",
      "url": "https://bexy.se/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://search.bexy.se/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <link rel="icon" type="image/svg" href="https://bexy.se/root/lib/assets/gfx/img/ico/favico/emblem/logo.svg">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap">
    
    <!-- External CSS -->
    <link rel="stylesheet" href="https://bexy.se/root/lib/src/css/style-v3.css">
</head>
<body>
    
    <main class="c">
        <form id="sq" class="qf" action="https://search.bexy.se/search" method="POST" role="search" aria-label="Site search">
            <h1>Bex</h1>
            
            <div class="qw">
                <input id="q" class="qi" type="search" name="q" placeholder="Search the internet..." autocomplete="off" spellcheck="off" aria-label="Search query" required>
                <input id="qim" class="qi hidden" type="file" name="encoded_image" accept="image/png, image/jpeg, image/gif, image/webp">

                <button type="button" id="clr" class="ib x hidden" aria-label="Clear search">
                    <img class="i" src="https://bexy.se/root/lib/assets/gfx/img/ico/btn/clr.svg" alt="Clear">
                </button>
                <button type="submit" class="ib q" aria-label="Submit search" title="Search">
                    <img class="i" src="https://bexy.se/root/lib/assets/gfx/img/ico/btn/sok.svg" alt="sok">
                </button>
                <button type="button" id="mb" class="ib m" aria-label="Search options" aria-haspopup="true" aria-expanded="false">
                    <img class="i" src="https://bexy.se/root/lib/assets/gfx/img/ico/btn/mom.svg" alt="opt">
                </button>

                <div id="mdd">
                    <button type="button" data-mode="web" class="active">
                        <img class="i" src="https://bexy.se/root/lib/assets/gfx/img/ico/btn/www.svg" alt="Web"> Internet Search [Alpha]
                    </button>
                    <button type="button" data-mode="image" disabled>
                        <img class="i" src="https://bexy.se/root/lib/assets/gfx/img/ico/btn/img.svg" alt="Image"> Image Search [Coming soon]
                    </button>
                    <button type="button" data-mode="store" disabled>
                        <img class="i" src="https://bexy.se/root/lib/assets/gfx/img/ico/btn/btk.svg" alt="Item"> Product Search [Coming soon]
                    </button>
                    <button type="button" data-mode="speech">
                        <img class="i" src="https://bexy.se/root/lib/assets/gfx/img/ico/btn/mic.svg" alt="Speech"> Voice Search
                    </button>
                </div>
            </div>
        </form>

        <div id="scsc"><div id="scsg"></div></div>
    </main>

    <footer><i>Powered by <a href="https://github.com/searxng/searxng" target="_blank" rel="noopener noreferrer">Searxng</a></i></footer>

    <!-- Modals -->
    <div id="add-modal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <h3>Add Shortcut</h3>
            <form id="add-form">
                <input type="text" id="site-name" class="modal-input" placeholder="Site Name (e.g., Google)" required>
                <input type="url" id="site-url" class="modal-input" placeholder="URL (e.g., https://google.com)" required>
                <div class="modal-buttons">
                    <button type="button" class="modal-btn secondary close-modal">Cancel</button>
                    <button type="submit" class="modal-btn primary">Add Site</button>
                </div>
            </form>
        </div>
    </div>

    <div id="msg-modal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="msg-title">Message</h3>
            <p id="msg-text"></p>
            <div class="modal-buttons">
                <button type="button" class="modal-btn primary close-modal">OK</button>
            </div>
        </div>
    </div>

    <div id="confirm-modal" class="modal-overlay">
        <div class="modal-box">
            <h3>Confirm Action</h3>
            <p id="confirm-text"></p>
            <div class="modal-btns">
                <button type="button" id="confirm-no" class="modal-btn secondary close-modal">Cancel</button>
                <button type="button" id="confirm-yes" class="modal-btn danger">Yes, Delete</button>
            </div>
        </div>
    </div>

    <!-- External JS -->
    <script src="https://bexy.se/root/lib/src/js/temp.js" defer crossorigin="anonymous"></script>
</body>
</html>
