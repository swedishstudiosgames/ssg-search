<!doctype html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bex is an open-source secure, and privacy focused search engine.">
    <title>Bex</title>
    <link rel="icon" type="image/svg" href="https://bexy.se/root/lib/assets/gfx/img/ico/favico/emblem/logo.svg">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap">
    <link rel="stylesheet" href="https://bexy.se/root/lib/src/css/style-v2.css">
    
    <style>
        /* ========================================= */
        /* CUSTOM STYLES (Shortcuts, Modals, Auto)   */
        /* ========================================= */
        
        /* Shortcuts Grid */
        #shortcuts-container {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-top: 40px;
        }
        #shortcuts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 500px;
        }
        .shortcut-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: inherit;
            padding: 10px;
            border-radius: 12px;
            transition: background 0.2s ease;
            cursor: pointer;
            background: transparent;
            border: none;
            font-family: inherit;
        }
        .shortcut-btn:hover {
            background: rgba(128, 128, 128, 0.15);
        }
        .shortcut-btn img, .add-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #fff;
            padding: 8px;
            margin-bottom: 10px;
            object-fit: contain;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .add-icon {
            background: rgba(128, 128, 128, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 400;
            color: inherit;
            box-shadow: none;
        }
        .shortcut-btn span {
            font-size: 0.85rem;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            opacity: 0.9;
        }

        /* Autocomplete Dropdown */
        .qw { position: relative; } /* Ensure dropdown aligns with search bar */
        
        .autocomplete-items {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #1e1e1e; /* Dark mode optimized */
            border: 1px solid #333;
            border-radius: 16px;
            margin-top: 8px;
            z-index: 99;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: none; /* Hidden by default */
        }
        @media (prefers-color-scheme: light) {
            .autocomplete-items {
                background: #ffffff;
                border: 1px solid #ddd;
                box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            }
            .autocomplete-item { color: #333 !important; }
            .autocomplete-item:hover { background: #f0f0f0 !important; }
        }
        .autocomplete-item {
            padding: 14px 20px;
            cursor: pointer;
            color: #fff;
            transition: background 0.2s;
            font-size: 1rem;
        }
        .autocomplete-item:hover {
            background: #2c2c2c;
        }

        /* Modal Overlays */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-box {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 16px;
            padding: 24px;
            width: 90%;
            max-width: 400px;
            color: #fff;
            box-shadow: 0 12px 32px rgba(0,0,0,0.5);
        }
        @media (prefers-color-scheme: light) {
            .modal-box {
                background: #ffffff;
                border: 1px solid #ddd;
                color: #333;
            }
            .modal-input {
                background: #f9f9f9 !important;
                border: 1px solid #ccc !important;
                color: #333 !important;
            }
            .modal-btn.secondary { background: #e0e0e0 !important; color: #333 !important; }
        }
        .modal-box h3 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.25rem;
        }
        .modal-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #2c2c2c;
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
        }
        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 10px;
        }
        .modal-btn {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #444;
            color: #fff;
            font-family: inherit;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        .modal-btn:hover { opacity: 0.8; }
        .modal-btn.primary { background: #0078d7; color: #fff; }
        .modal-btn.danger { background: #d32f2f; color: #fff; }

        /* Disabled Menu Buttons */
        #mdd button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    
    <div class="c">
        <form id="sq" class="qf" action="https://search.bexy.se/search" method="POST" role="search" aria-label="Site search">
            <h1>Bex</h1>
            
            <div class="qw">
                <input id="q" class="qi" type="search" name="q" 
                       placeholder="Search the internet..." 
                       autocomplete="off" spellcheck="off" 
                       aria-label="Search query" required>
                
                <input id="qim" class="qi hidden" type="file" name="encoded_image" accept="image/png, image/jpeg, image/gif, image/webp">

                <button type="button" id="clr" class="ib x hidden" aria-label="Clear search">
                    <img class="i" src="https://bexy.se/root/lib/assets/gfx/img/ico/btn/clr.svg" alt="Clear">
                </button>

                <button type="submit" class="ib q" aria-label="Submit search" title="Search">
                    <img class="i" src="https://bexy.se/root/lib/assets/gfx/img/ico/btn/sok.svg" alt="Search">
                </button>

                <button type="button" id="mb" class="ib m" aria-label="Search options" aria-haspopup="true" aria-expanded="false">
                    <img class="i" src="https://bexy.se/root/lib/assets/gfx/img/ico/btn/mom.svg" alt="Options">
                </button>

                <div id="mdd">
                    <button type="button" data-mode="web" class="active">
                        <img class="i" src="https://bexy.se/root/lib/assets/gfx/img/ico/btn/www.svg" alt="Web">
                        Internet Search [Alpha]
                    </button>
                    <!-- Disabled functionality buttons -->
                    <button type="button" data-mode="image" disabled>
                        <img class="i" src="https://bexy.se/root/lib/assets/gfx/img/ico/btn/img.svg" alt="Image">
                        Image Search [Coming soon]
                    </button>
                    <button type="button" data-mode="store" disabled>
                        <img class="i" src="https://bexy.se/root/lib/assets/gfx/img/ico/btn/btk.svg" alt="Store">
                        Store Search [Coming soon]
                    </button>
                    <button type="button" data-mode="speech">
                        <img class="i" src="https://bexy.se/root/lib/assets/gfx/img/ico/btn/mic.svg" alt="Speech">
                        Voice Search
                    </button>
                </div>
            </div>
        </form>

        <!-- Shortcuts Section -->
        <div id="shortcuts-container">
            <div id="shortcuts-grid"></div>
        </div>
    </div>

    <footer>
        <i>Powered by <a href="https://github.com/searxng/searxng">Searxng</a></i>
    </footer>

    <!-- Modals -->
    <div id="add-modal" class="modal-overlay">
        <div class="modal-box">
            <h3>Add Shortcut</h3>
            <form id="add-form">
                <input type="text" id="site-name" class="modal-input" placeholder="Site Name (e.g., Google)" required>
                <input type="url" id="site-url" class="modal-input" placeholder="URL (e.g., https://google.com)" required>
                <div class="modal-buttons">
                    <button type="button" class="modal-btn secondary close-modal">Cancel</button>
                    <button type="submit" class="modal-btn primary">Add Site</button>
                </div>
            </form>
        </div>
    </div>

    <div id="msg-modal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="msg-title">Message</h3>
            <p id="msg-text"></p>
            <div class="modal-buttons">
                <button type="button" class="modal-btn primary close-modal">OK</button>
            </div>
        </div>
    </div>

    <div id="confirm-modal" class="modal-overlay">
        <div class="modal-box">
            <h3>Confirm Action</h3>
            <p id="confirm-text"></p>
            <div class="modal-buttons">
                <button type="button" id="confirm-no" class="modal-btn secondary">Cancel</button>
                <button type="button" id="confirm-yes" class="modal-btn danger">Yes, Delete</button>
            </div>
        </div>
    </div>

    <script src="https://bexy.se/root/lib/src/js/temp.js" defer crossorigin="anonymous"></script>

    <script>
    /**
     * MASTER JAVASCRIPT BUNDLE
     * Handles: Modals, Shortcuts (Cookies), Autocomplete, & Search Logic
     */
    document.addEventListener('DOMContentLoaded', () => {
        
        const WORKER_URL = '/upload'; 
        let currentMode = 'web';

        const ui = {
            form: document.getElementById('sq'),
            textInput: document.getElementById('q'),
            fileInput: document.getElementById('qim'),
            clearBtn: document.getElementById('clr'),
            menuBtn: document.getElementById('mb'),
            menuDropdown: document.getElementById('mdd'),
            modeBtns: document.querySelectorAll('#mdd button')
        };

        if (!ui.form) return;

        // Detect if the user is on a mobile device (phones and tablets)
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobi/i.test(navigator.userAgent);
        
        // Disable Voice Search if on a desktop computer
        const speechBtn = document.querySelector('button[data-mode="speech"]');
        if (speechBtn && !isMobile) {
            speechBtn.setAttribute('disabled', 'true');
            speechBtn.innerHTML = `<img class="i" src="https://bexy.se/root/lib/assets/gfx/img/ico/btn/mic.svg" alt="Speech"> Voice Search [Mobile Only]`;
        }

        // =========================================
        // 1. DIALOG MODAL SYSTEM
        // =========================================
        function showMessage(title, text) {
            document.getElementById('msg-title').innerText = title;
            document.getElementById('msg-text').innerText = text;
            document.getElementById('msg-modal').style.display = 'flex';
        }

        let confirmCallback = null;
        function showConfirm(text, callback) {
            document.getElementById('confirm-text').innerText = text;
            confirmCallback = callback;
            document.getElementById('confirm-modal').style.display = 'flex';
        }

        document.getElementById('confirm-yes').addEventListener('click', () => {
            document.getElementById('confirm-modal').style.display = 'none';
            if (confirmCallback) confirmCallback();
        });
        
        document.getElementById('confirm-no').addEventListener('click', () => {
            document.getElementById('confirm-modal').style.display = 'none';
            confirmCallback = null;
        });

        document.querySelectorAll('.close-modal').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.target.closest('.modal-overlay').style.display = 'none';
            });
        });

        // =========================================
        // 2. AUTOCOMPLETE ENGINE (Google JSONP)
        // =========================================
        const acContainer = document.createElement('div');
        acContainer.className = 'autocomplete-items';
        ui.textInput.parentNode.appendChild(acContainer);

        let debounceTimeout;

        // Secure, global callback for Google's JSONP response
        window.bexAutocompleteCallback = function(data) {
            try {
                // Google returns data as ["search string", ["suggestion 1", "suggestion 2"]]
                const suggestions = data[1] || []; 
                acContainer.innerHTML = '';
                
                if (suggestions.length > 0 && ui.textInput.value.trim().length > 0) {
                    suggestions.forEach(phrase => {
                        const div = document.createElement('div');
                        div.className = 'autocomplete-item';
                        div.innerText = phrase;
                        
                        div.addEventListener('click', function(e) {
                            e.preventDefault();
                            ui.textInput.value = this.innerText;
                            acContainer.style.display = 'none';
                            // Immediately submit the form safely
                            ui.form.submit();
                        });
                        acContainer.appendChild(div);
                    });
                    acContainer.style.display = 'block';
                } else {
                    acContainer.style.display = 'none';
                }
            } catch (err) {
                console.error("Autocomplete processing error:", err);
            }
        };

        ui.textInput.addEventListener('input', function() {
            const val = this.value;
            
            if (!val.trim() || currentMode !== 'web') {
                acContainer.style.display = 'none';
                return;
            }
            
            clearTimeout(debounceTimeout);
            debounceTimeout = setTimeout(() => {
                try {
                    // Clean up old scripts to keep DOM light
                    const oldScript = document.getElementById('jsonp-script');
                    if (oldScript) oldScript.remove();

                    // Google's suggestion endpoint is highly reliable and CORS friendly via JSONP
                    const script = document.createElement('script');
                    script.id = 'jsonp-script';
                    script.src = `https://suggestqueries.google.com/complete/search?client=firefox&q=${encodeURIComponent(val)}&callback=bexAutocompleteCallback`;
                    document.body.appendChild(script);
                } catch(err) {
                    console.error("Failed to fetch autocomplete", err);
                }
            }, 150); 
        });

        // Hide autocomplete when clicking elsewhere
        document.addEventListener('click', (e) => {
            if (e.target !== ui.textInput && !acContainer.contains(e.target)) {
                acContainer.style.display = 'none';
            }
        });


        // =========================================
        // 3. SHORTCUTS & COOKIE LOGIC
        // =========================================
        function setCookie(name, value, days) {
            const d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            document.cookie = `${name}=${encodeURIComponent(value)};expires=${d.toUTCString()};path=/`;
        }

        function getCookie(name) {
            const ca = document.cookie.split(';');
            for(let i = 0; i < ca.length; i++) {
                let c = ca[i].trim();
                if (c.indexOf(name + "=") === 0) {
                    return decodeURIComponent(c.substring(name.length + 1));
                }
            }
            return "";
        }

        const defaultSites = [
            { name: "YouTube", url: "https://youtube.com" },
            { name: "Reddit", url: "https://reddit.com" },
            { name: "GitHub", url: "https://github.com" },
            { name: "Wikipedia", url: "https://wikipedia.org" }
        ];

        let sites = [];
        try {
            const savedData = getCookie('bex_shortcuts');
            sites = savedData ? JSON.parse(savedData) : defaultSites;
        } catch (e) {
            console.error("Cookie parsing failed, resetting to defaults.");
            sites = defaultSites;
        }

        const grid = document.getElementById('shortcuts-grid');

        function renderShortcuts() {
            grid.innerHTML = '';
            
            sites.forEach((site, index) => {
                const a = document.createElement('a');
                a.href = site.url;
                a.className = 'shortcut-btn';
                a.title = site.name;
                
                // Try to extract hostname safely for the DuckDuckGo icon
                let domain = "";
                try {
                    domain = new URL(site.url).hostname;
                } catch(err) {
                    domain = site.url; 
                }

                a.innerHTML = `
                    <img src="https://icons.duckduckgo.com/ip3/${domain}.ico" 
                         alt="${site.name}" 
                         onerror="this.src='https://bexy.se/root/lib/assets/gfx/img/ico/favico/emblem/logo.svg'">
                    <span>${site.name}</span>
                `;
                
                a.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    showConfirm(`Are you sure you want to remove "${site.name}" from your shortcuts?`, () => {
                        sites.splice(index, 1);
                        setCookie('bex_shortcuts', JSON.stringify(sites), 30);
                        renderShortcuts();
                    });
                });

                grid.appendChild(a);
            });

            // "Add Site" Button
            const addBtn = document.createElement('button');
            addBtn.className = 'shortcut-btn add-btn';
            addBtn.innerHTML = `<div class="add-icon">+</div><span>Add Site</span>`;
            addBtn.addEventListener('click', (e) => {
                e.preventDefault();
                document.getElementById('add-modal').style.display = 'flex';
            });
            grid.appendChild(addBtn);
        }

        document.getElementById('add-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('site-name').value.trim();
            let url = document.getElementById('site-url').value.trim();
            
            if (name && url) {
                if (!url.startsWith('http://') && !url.startsWith('https://')) {
                    url = 'https://' + url;
                }
                sites.push({ name, url });
                setCookie('bex_shortcuts', JSON.stringify(sites), 30);
                renderShortcuts();
                
                document.getElementById('add-form').reset();
                document.getElementById('add-modal').style.display = 'none';
            }
        });

        // Initial Render
        renderShortcuts();


        // =========================================
        // 4. SEARCH UI & SUBMISSION LOGIC
        // =========================================
        function toggleClearBtn() {
            if (ui.textInput.value.length > 0) {
                ui.clearBtn.classList.remove('hidden');
            } else {
                ui.clearBtn.classList.add('hidden');
            }
        }

        ui.textInput.addEventListener('input', toggleClearBtn);
        
        ui.clearBtn.addEventListener('click', () => {
            ui.textInput.value = '';
            toggleClearBtn();
            ui.textInput.focus();
        });

        ui.menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isVisible = ui.menuDropdown.style.display === 'block';
            ui.menuDropdown.style.display = isVisible ? 'none' : 'block';
            ui.menuBtn.setAttribute('aria-expanded', !isVisible);
        });

        document.addEventListener('click', (e) => {
            if (!ui.menuBtn.contains(e.target) && !ui.menuDropdown.contains(e.target)) {
                ui.menuDropdown.style.display = 'none';
            }
        });

        ui.modeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                if (btn.hasAttribute('disabled')) return; // Ignore if disabled

                ui.modeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                setSearchMode(btn.dataset.mode);
                ui.menuDropdown.style.display = 'none';
            });
        });

        function setSearchMode(mode) {
            currentMode = mode;
            ui.textInput.value = '';
            ui.fileInput.value = '';
            toggleClearBtn();

            ui.textInput.classList.remove('hidden');
            ui.fileInput.classList.add('hidden');
            ui.clearBtn.classList.add('hidden');

            switch (mode) {
                case 'image':
                    ui.textInput.classList.add('hidden');
                    ui.fileInput.classList.remove('hidden');
                    ui.textInput.removeAttribute('required');
                    break;
                case 'store':
                    ui.textInput.placeholder = "Search the store...";
                    ui.textInput.setAttribute('required', '');
                    break;
                case 'speech':
                    if (!isMobile) {
                        showMessage("Mobile Only", "Voice search is currently restricted to mobile devices.");
                        break;
                    }
                    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                        startDictation();
                    } else {
                        showMessage("Not Supported", "Speech recognition is not supported in this browser.");
                    }
                    ui.textInput.classList.remove('hidden'); 
                    break;
                default: 
                    ui.textInput.placeholder = "Search the internet...";
                    ui.textInput.setAttribute('required', '');
                    break;
            }
        }

        // Handle the final Form Submit
        ui.form.addEventListener('submit', (e) => {
            if (currentMode === 'image') {
                e.preventDefault(); // Stop standard form submission
                
                const file = ui.fileInput.files[0];
                if (!file) return;

                const validTypes = ['image/jpeg', 'image/png', 'image/gif', 'image/webp', 'image/bmp'];
                if (!validTypes.includes(file.type)) {
                    showMessage("Invalid File", "Please upload a valid image file.");
                    ui.fileInput.value = ''; 
                    return;
                }
                handleSecureProxySearch(file);
            } 
            else if (currentMode === 'store') {
                e.preventDefault(); // Stop standard form submission to override domain
                const query = ui.textInput.value.trim();
                if (!query) return;
                window.location.href = `https://store.swedishstudiosgames.com/search?q=${encodeURIComponent(query)}`;
            }
            // For 'web' mode, we do nothing and let the HTML5 form securely POST naturally to Bexy.se!
        });

        function handleSecureProxySearch(file) {
            const newTab = window.open('', '_blank');
            if (newTab) {
                newTab.document.write(`
                    <html>
                        <head><title>Secure Search...</title></head>
                        <body style="font-family:sans-serif; text-align:center; padding-top:50px;">
                            <h2>Uploading encrypted image...</h2>
                            <p>Your image will automatically expire in 5 minutes.</p>
                            <div id="status" style="color:#666;">Contacting Secure Proxy...</div>
                        </body>
                    </html>
                `);
            } else {
                showMessage("Popup Blocked", "Please allow popups to use the secure image proxy.");
                return;
            }

            const formData = new FormData();
            formData.append('image', file);

            fetch(WORKER_URL, {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(json => {
                if (!json.success) throw new Error(json.error?.message || "Upload failed");
                if (newTab) {
                    newTab.document.getElementById('status').innerText = "Opening image...";
                    newTab.location.href = json.data.url;
                }
                ui.fileInput.value = ''; 
            })
            .catch(err => {
                console.error('Error:', err);
                if (newTab) {
                    newTab.document.body.innerHTML = `
                        <h2 style="color:red">Error</h2>
                        <p>Failed to connect to secure proxy.</p>
                        <p>${err.message}</p>
                        <p>Please close this tab and try again.</p>
                    `;
                } else {
                    showMessage("Error", "Failed to upload image.");
                }
            });
        }

        function startDictation() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                showMessage("Not Supported", "Your browser does not support native speech recognition. Please try Chrome, Edge, or Safari.");
                return;
            }

            const recognition = new SpeechRecognition();
            
            // Automatically use the device's native OS language setting
            recognition.lang = navigator.language || 'en-US';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            ui.textInput.placeholder = "Listening... (Speak now)";
            
            try {
                recognition.start();
            } catch (e) {
                console.error("Speech start error:", e);
            }

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                ui.textInput.value = transcript;
                toggleClearBtn(); 
                ui.textInput.placeholder = "Search the internet...";
                
                // Auto-submit the search as soon as speech is recognized
                if (transcript.trim().length > 0) {
                    ui.form.submit();
                }
            };
            
            recognition.onspeechend = () => {
                recognition.stop();
                ui.textInput.placeholder = "Search the internet...";
            };
            
            recognition.onerror = (event) => {
                console.error("Microphone error:", event.error);
                ui.textInput.placeholder = "Search the internet...";
                if (event.error !== 'no-speech') {
                    showMessage("Microphone Error", "Could not hear you. Please ensure your device has a working microphone and you have granted permission.");
                }
            };
        }
    });
    </script>
</body>
</html>
